<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy New Year Countdown 🎉</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: radial-gradient(circle at top, #2b1055, #000000);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .container {
      z-index: 2;
      padding: 20px 40px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.4);
      box-shadow: 0 0 40px rgba(255, 0, 255, 0.3);
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #ff0080, #00eaff, #ffe600);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    #countdown {
      font-size: 5rem;
      font-weight: 900;
      letter-spacing: 6px;
      color: #ffffff;
      text-shadow:
        0 0 10px #ff00ff,
        0 0 20px #00ffff,
        0 0 40px #ffea00;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>

<canvas id="fireworks"></canvas>

<div class="container">
  <h1 id="message"></h1>
  <div id="countdown">00:00:00</div>
</div>

<script>
  let name = localStorage.getItem("newYearName");

  if (!name) {
    name = prompt("Enter your name:");
    localStorage.setItem("newYearName", name);
  }

  const message = document.getElementById("message");
  const countdownEl = document.getElementById("countdown");

  message.textContent = `Kelvin wishes you a New Year, ${name}`;

  function getNewYearTime() {
    const now = new Date();
    return new Date(now.getFullYear() + 1, 0, 1, 0, 0, 0);
  }

  const newYear = getNewYearTime();

  function updateCountdown() {
    const now = new Date();
    const diff = newYear - now;

    if (diff <= 0) {
      countdownEl.textContent = "00:00:00";
      message.textContent = `🎉 HAPPY NEW YEAR ${name}! 🎉`;
      startFireworks();
      clearInterval(timer);
      return;
    }

    const hours = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, "0");
    const minutes = String(Math.floor((diff / (1000 * 60)) % 60)).padStart(2, "0");
    const seconds = String(Math.floor((diff / 1000) % 60)).padStart(2, "0");

    countdownEl.textContent = `${hours}:${minutes}:${seconds}`;
  }

  const timer = setInterval(updateCountdown, 1000);
  updateCountdown();

  const canvas = document.getElementById("fireworks");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  function random(min, max) {
    return Math.random() * (max - min) + min;
  }

  function shootFirework() {
    const x = random(0, canvas.width);
    const y = random(0, canvas.height / 2);

    for (let i = 0; i < 100; i++) {
      ctx.beginPath();
      ctx.arc(x + random(-50, 50), y + random(-50, 50), 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `hsl(${random(0, 360)}, 100%, 60%)`;
      ctx.fill();
    }
  }

  function startFireworks() {
    setInterval(() => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      shootFirework();
    }, 250);
  }

  window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>

</body>
</html>
